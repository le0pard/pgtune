# NOTE
# shared_buffers is large: reserve Linux huge pages
# (vm.nr_hugepages) to reduce memory used by page tables
# of each connection. See "Linux Huge Pages" in PostgreSQL
# documentation to calculate the number of huge pages

# DB Version: 13
# OS Type: Linux
# DB Type: Online transaction processing system
# Total Memory (RAM): 16 GB
# CPUs num: 8
# Connections num: 1000
# Data Storage: SSD storage
# Total Data Size: 1x - 3x RAM

max_connections = 1000               # restart required
shared_buffers = 4GB                 # restart required
effective_cache_size = 12GB
maintenance_work_mem = 1GB
checkpoint_completion_target = 0.9
wal_buffers = 16MB                   # restart required
random_page_cost = 1.1
effective_io_concurrency = 200
maintenance_io_concurrency = 200
work_mem = 4MB
jit = off
wal_compression = on
vacuum_cost_page_miss = 2
min_wal_size = 2GB
max_wal_size = 8GB                   # needs free disk space
max_worker_processes = 8             # restart required
max_parallel_workers_per_gather = 4
max_parallel_workers = 8
max_parallel_maintenance_workers = 4
