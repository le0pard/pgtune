# WARNING (may prevent startup)
# wal_compression = lz4 requires PostgreSQL compiled
# with --with-lz4. Check build support:
# SELECT enumvals FROM pg_settings WHERE name = 'wal_compression';
#
# NOTE
# This tool is not optimal for very high memory systems
#
# shared_buffers is large: reserve Linux huge pages
# (vm.nr_hugepages) to reduce memory used by page tables
# of each connection. Required number of huge pages
# (with these settings, while the server is stopped):
# postgres -D $PGDATA -C shared_memory_size_in_huge_pages
#
# Cost parameters for Data Warehouses on SAN storage
# are left at defaults to avoid catastrophic index scan
# selections. Monitor query planner behavior and adjust
# random_page_cost if necessary

# DB Version: 17
# OS Type: Linux
# DB Type: Data warehouse
# Total Memory (RAM): 256 GB
# CPUs num: 64
# Connections num: 100 (not provided, assumed)
# Data Storage: Network (SAN) storage
# Total Data Size: More than 3x RAM

max_connections = 100                # restart required
shared_buffers = 64GB                # restart required
effective_cache_size = 192GB
maintenance_work_mem = 8GB
wal_buffers = 16MB                   # restart required
default_statistics_target = 500
random_page_cost = 4
effective_io_concurrency = 300
maintenance_io_concurrency = 300
work_mem = 179MB
wal_compression = lz4
autovacuum_max_workers = 5           # restart required
autovacuum_work_mem = 1GB
autovacuum_vacuum_cost_limit = 333
min_wal_size = 4GB
max_wal_size = 16GB                  # needs free disk space
max_worker_processes = 64            # restart required
max_parallel_workers_per_gather = 16
max_parallel_workers = 64
max_parallel_maintenance_workers = 4
