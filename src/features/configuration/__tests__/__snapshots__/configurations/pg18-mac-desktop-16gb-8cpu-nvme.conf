# WARNING (may prevent startup)
# wal_level = minimal: PostgreSQL will not start if
# archive_mode = on or if replication slots exist.
# Replication, pg_basebackup and point-in-time recovery
# are not possible
#
# wal_compression = lz4 requires PostgreSQL compiled
# with --with-lz4. Check build support:
# SELECT enumvals FROM pg_settings WHERE name = 'wal_compression';

# DB Version: 18
# OS Type: MacOS
# DB Type: Desktop application
# Total Memory (RAM): 16 GB
# CPUs num: 8
# Connections num: 100 (not provided, assumed)
# Data Storage: NVMe storage
# Total Data Size: 1x - 3x RAM

max_connections = 100                # restart required
shared_buffers = 1GB                 # restart required
effective_cache_size = 4GB
maintenance_work_mem = 1GB
wal_buffers = 16MB                   # restart required
random_page_cost = 1.1
effective_io_concurrency = 1000
maintenance_io_concurrency = 1000
work_mem = 7MB
wal_compression = lz4
min_wal_size = 100MB
max_wal_size = 2GB                   # needs free disk space
max_worker_processes = 8             # restart required
max_parallel_workers_per_gather = 4
max_parallel_workers = 8
max_parallel_maintenance_workers = 4
wal_level = minimal                  # restart required
max_wal_senders = 0                  # restart required
