# WARNING (may prevent startup)
# wal_compression = lz4 requires PostgreSQL compiled
# with --with-lz4. Check build support:
# SELECT enumvals FROM pg_settings WHERE name = 'wal_compression';
#
# io_method = io_uring requires PostgreSQL compiled
# with --with-liburing, and io_uring allowed by the kernel
# (kernel.io_uring_disabled sysctl) and by containers
# (Docker default seccomp profile blocks it). Check build support:
# SELECT enumvals FROM pg_settings WHERE name = 'io_method';
#
# WARNING (memory risk)
# max_connections = 100 is too high for this amount of RAM:
# work_mem is raised to the 4MB minimum, so under load
# PostgreSQL can run out of memory. Lower max_connections
# or use a connection pooler (e.g. PgBouncer)
#
# NOTE
# This tool is not optimal for low memory systems

# DB Version: 18
# OS Type: Linux
# DB Type: Mixed type of application
# Total Memory (RAM): 512 MB
# CPUs num: 2
# Connections num: 100 (not provided, assumed)
# Data Storage: HDD storage
# Total Data Size: 1x - 3x RAM

max_connections = 100          # restart required
shared_buffers = 128MB         # restart required
effective_cache_size = 384MB
maintenance_work_mem = 32MB
wal_buffers = 4MB              # restart required
random_page_cost = 4
effective_io_concurrency = 2
maintenance_io_concurrency = 2
work_mem = 4MB
jit = off
wal_compression = lz4
io_method = io_uring           # restart required
min_wal_size = 1GB
max_wal_size = 4GB             # needs free disk space
