# NOTE
# shared_buffers is large: reserve Linux huge pages
# (vm.nr_hugepages) to reduce memory used by page tables
# of each connection. See "Linux Huge Pages" in PostgreSQL
# documentation to calculate the number of huge pages

# DB Version: 11
# OS Type: Linux
# DB Type: Data warehouse
# Total Memory (RAM): 64 GB
# CPUs num: 32
# Connections num: 100 (not provided, assumed)
# Data Storage: HDD storage
# Total Data Size: 1x - 3x RAM

max_connections = 100                # restart required
shared_buffers = 16GB                # restart required
effective_cache_size = 48GB
maintenance_work_mem = 8GB
checkpoint_completion_target = 0.9
wal_buffers = 16MB                   # restart required
default_statistics_target = 500
random_page_cost = 4
effective_io_concurrency = 2
work_mem = 62MB
wal_compression = on
autovacuum_max_workers = 5           # restart required
autovacuum_work_mem = 1GB
autovacuum_vacuum_cost_limit = 333
autovacuum_vacuum_cost_delay = 2ms
vacuum_cost_page_miss = 2
min_wal_size = 4GB
max_wal_size = 16GB                  # needs free disk space
max_worker_processes = 32            # restart required
max_parallel_workers_per_gather = 8
max_parallel_workers = 32
max_parallel_maintenance_workers = 4
