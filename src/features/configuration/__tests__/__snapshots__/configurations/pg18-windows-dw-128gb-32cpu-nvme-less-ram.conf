# WARNING (may prevent startup)
# wal_compression = lz4 requires PostgreSQL compiled
# with --with-lz4. Check build support:
# SELECT enumvals FROM pg_settings WHERE name = 'wal_compression';
#
# NOTE
# This tool is not optimal for very high memory systems
#
# shared_buffers is large: grant the "Lock pages in memory"
# right to the PostgreSQL service account to use huge pages

# DB Version: 18
# OS Type: Windows
# DB Type: Data warehouse
# Total Memory (RAM): 128 GB
# CPUs num: 32
# Connections num: 100 (not provided, assumed)
# Data Storage: NVMe storage
# Total Data Size: Less than RAM

max_connections = 100                # restart required
shared_buffers = 32GB                # restart required
effective_cache_size = 96GB
maintenance_work_mem = 8GB
wal_buffers = 16MB                   # restart required
default_statistics_target = 500
random_page_cost = 1.1
effective_io_concurrency = 1000
maintenance_io_concurrency = 1000
work_mem = 161MB
wal_compression = lz4
autovacuum_max_workers = 5
autovacuum_work_mem = 1GB
autovacuum_vacuum_cost_limit = 333
io_workers = 8
min_wal_size = 4GB
max_wal_size = 16GB                  # needs free disk space
max_worker_processes = 32            # restart required
max_parallel_workers_per_gather = 8
max_parallel_workers = 32
max_parallel_maintenance_workers = 4
