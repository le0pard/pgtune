# WARNING (memory risk)
# max_connections = 2000 is too high for this amount of RAM:
# work_mem is raised to the 4MB minimum, so under load
# PostgreSQL can run out of memory. Lower max_connections
# or use a connection pooler (e.g. PgBouncer)

# DB Version: 12
# OS Type: Linux
# DB Type: Web application
# Total Memory (RAM): 4 GB
# CPUs num: 2
# Connections num: 2000
# Data Storage: Network (SAN) storage
# Total Data Size: 1x - 3x RAM

max_connections = 2000             # restart required
shared_buffers = 1GB               # restart required
effective_cache_size = 3GB
maintenance_work_mem = 256MB
checkpoint_completion_target = 0.9
wal_buffers = 16MB                 # restart required
random_page_cost = 1.1
effective_io_concurrency = 300
work_mem = 4MB
jit = off
wal_compression = on
vacuum_cost_page_miss = 2
min_wal_size = 1GB
max_wal_size = 4GB                 # needs free disk space
